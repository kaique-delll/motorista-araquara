<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Manutenção - Nova Mega G</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Realtime Database SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        // Configuração do Firebase (Aponte para o seu projeto do Realtime Database)
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForArtifactsInitializationOnly12345",
            authDomain: "nova-mega-g-frota.firebaseapp.com",
            databaseURL: "https://motoristaararaquara-default-rtdb.firebaseio.com/", // URL do seu Realtime Database
            projectId: "nova-mega-g-frota",
            storageBucket: "nova-mega-g-frota.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456789"
        };

        let app, db;
        try {
            app = initializeApp(firebaseConfig);
            db = getDatabase(app);
        } catch (e) {
            console.warn("Erro ao iniciar Firebase:", e);
        }

        window.FB_RTDB = { db, ref, set, push, onValue, update, remove };
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- TELA DE LOGIN -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-red-900 via-red-800 to-gray-900">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-8 border-t-4 border-red-600">
            <div class="text-center mb-8">
                <div class="bg-red-100 text-red-700 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
                    <i class="fa-solid fa-truck-fast"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Nova Mega G</h1>
                <p class="text-sm text-gray-500">Controle de Manutenção - Frota Própria</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">E-mail</label>
                    <input type="email" id="loginEmail" autocomplete="off" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none text-sm" placeholder="seu.email@megag.com.br">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Senha</label>
                    <input type="password" id="loginPassword" autocomplete="new-password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none text-sm" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
                    Entrar no Sistema
                </button>
            </form>

            <div class="mt-6 text-center">
                <button onclick="toggleRegisterMode()" class="text-xs text-red-600 hover:underline font-semibold">
                    Não tem conta? Cadastrar novo motorista/gestor
                </button>
            </div>
        </div>
    </div>

    <!-- APLICAÇÃO PRINCIPAL -->
    <div id="appScreen" class="hidden min-h-screen flex flex-col">
        <header class="bg-gray-900 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center space-x-3">
                    <div class="bg-red-600 p-2 rounded-lg text-white">
                        <i class="fa-solid fa-screwdriver-wrench text-xl"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-lg leading-tight">Nova Mega G Atacadista</h2>
                        <p class="text-xs text-gray-400">Gestão de Manutenção de Frota Própria (Casa)</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="text-right hidden sm:block">
                        <p id="userLoggedName" class="text-sm font-medium text-gray-200">Usuário</p>
                        <p id="userLoggedRole" class="text-xs text-red-400 font-semibold uppercase">Cargo</p>
                    </div>
                    <button onclick="logout()" class="bg-gray-800 hover:bg-red-600 text-gray-300 hover:text-white px-4 py-2 rounded-lg text-sm transition duration-200 border border-gray-700">
                        <i class="fa-solid fa-right-from-bracket mr-2"></i> Sair
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
            <!-- PAINEL DO MOTORISTA -->
            <div id="driverView" class="hidden space-y-6">
                <div class="bg-white rounded-

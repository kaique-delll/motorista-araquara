    <!-- Firebase Realtime Database SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForArtifactsInitializationOnly12345",
            authDomain: "nova-mega-g-frota.firebaseapp.com",
            databaseURL: "https://motoristaararaquara-default-rtdb.firebaseio.com/",
            projectId: "nova-mega-g-frota",
            storageBucket: "nova-mega-g-frota.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456789"
        };

        let app, db;
        try {
            app = initializeApp(firebaseConfig);
            db = getDatabase(app);
        } catch (e) {
            console.warn("Erro ao iniciar Firebase:", e);
        }

        window.FB_RTDB = { db, ref, set, push, onValue, update };
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // Configuração padrão do Firebase (Pode ajustar com o seu projeto se necessário)
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForArtifactsInitializationOnly12345",
            authDomain: "nova-mega-g-frota.firebaseapp.com",
            projectId: "nova-mega-g-frota",
            storageBucket: "nova-mega-g-frota.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456789"
        };

        // Inicialização com Fallback Local para garantir estabilidade absoluta
        let app, db, auth;
        let useLocalStorageFallback = false;

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.warn("Modo offline / localStorage ativado devido a restrição de rede:", e);
            useLocalStorageFallback = true;
        }

        // Expor instâncias globalmente para o script da aplicação
        window.FB = { db, auth, useLocalStorageFallback, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged };
    </script>
</head>

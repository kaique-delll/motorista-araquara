<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Manutenção - Nova Mega G</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDEq9o4Hah_zK2NCyxSPpR92nQ62ImvJoU",
            authDomain: "motoristaararaquara-59004.firebaseapp.com",
            databaseURL: "https://motoristaararaquara-59004-default-rtdb.europe-west1.firebasedatabase.app", 
            projectId: "motoristaararaquara-59004",
            storageBucket: "motoristaararaquara-59004.appspot.com",
            messagingSenderId: "533190289503",
            appId: "1:533190289503:web:bdda9e8ddcf8a7df4b93ea"

        let app, db;
        try {
            app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            console.log("Firebase conectado com sucesso!");
        } catch (e) {
            console.error("Erro ao conectar ao Firebase:", e);
        }

        window.FB_RTDB = { db, ref, set, push, onValue, update };
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- TELA DE LOGIN -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-red-900 via-red-800 to-gray-900">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-8 border-t-4 border-red-600">
            <div class="text-center mb-8">
                <div class="bg-red-100 text-red-700 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner">
                    <i class="fa-solid fa-truck-fast"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Nova Mega G</h1>
                <p class="text-sm text-gray-500">Controle de Manutenção - Frota Própria</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">E-mail</label>
                    <input type="email" id="loginEmail" autocomplete="off" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none text-sm" placeholder="seu.email@megag.com.br">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Senha</label>
                    <input type="password" id="loginPassword" autocomplete="new-password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none text-sm" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition duration-200 shadow-md">
                    Entrar no Sistema
                </button>
            </form>

            <div class="mt-6 text-center">
                <button onclick="toggleRegisterMode()" type="button" class="text-xs text-red-600 hover:underline font-semibold">
                    Não tem conta? Cadastrar novo motorista/gestor
                </button>
            </div>

            <div class="mt-4 p-3 bg-gray-50 rounded-lg text-xs text-gray-600 border">
                <p class="font-bold text-gray-700 mb-1">Acesso Direto (Clique para preencher):</p>
                <div class="flex gap-2 mt-2">
                    <button type="button" onclick="fillAccess('admin@megag.com.br', '123')" class="flex-1 bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 py-1.5 px-2 rounded font-semibold text-center">
                        <i class="fa-solid fa-user-tie mr-1"></i> Gestão
                    </button>
                    <button type="button" onclick="fillAccess('motorista@megag.com.br', '123')" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-300 py-1.5 px-2 rounded font-semibold text-center">
                        <i class="fa-solid fa-truck mr-1"></i> Motorista
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- APLICAÇÃO PRINCIPAL -->
    <div id="appScreen" class="hidden min-h-screen flex flex-col">
        <header class="bg-gray-900 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center space-x-3">
                    <div class="bg-red-600 p-2 rounded-lg text-white">
                        <i class="fa-solid fa-screwdriver-wrench text-xl"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-lg leading-tight">Nova Mega G Atacadista</h2>
                        <p class="text-xs text-gray-400">Gestão de Manutenção de Frota Própria (Casa)</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="text-right hidden sm:block">
                        <p id="userLoggedName" class="text-sm font-medium text-gray-200">Usuário</p>
                        <p id="userLoggedRole" class="text-xs text-red-400 font-semibold uppercase">Cargo</p>
                    </div>
                    <button onclick="logout()" class="bg-gray-800 hover:bg-red-600 text-gray-300 hover:text-white px-4 py-2 rounded-lg text-sm transition duration-200 border border-gray-700">
                        <i class="fa-solid fa-right-from-bracket mr-2"></i> Sair
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
            <!-- PAINEL DO MOTORISTA -->
            <div id="driverView" class="hidden space-y-6">
                <div class="bg-white rounded-xl shadow-md p-6 border-l-4 border-red-600">
                    <h3 class="text-lg font-bold text-gray-900 mb-1"><i class="fa-solid fa-file-pen text-red-600 mr-2"></i> Reportar Nova Manutenção ou Defeito</h3>
                    <p class="text-xs text-gray-500 mb-6">Preencha os dados do veículo da frota própria para registrar a solicitação.</p>
                    
                    <form id="maintenanceForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Placa do Veículo *</label>
                            <input type="text" id="mTruck" required placeholder="Ex: ABC-1234" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 text-sm uppercase">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Quilometragem Atual (KM) *</label>
                            <input type="number" id="mKm" required placeholder="Ex: 45200" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Destino / Rota do Veículo *</label>
                            <input type="text" id="mDestination" required placeholder="Ex: Araraquara -> Ribeirão Preto" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Status do Orçamento *</label>
                            <select id="mBudgetStatus" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-red-500 text-sm bg-white">
                                <option value="Não necessário / Avaliação inicial">Não necessário / Avaliação inicial</option>
                                <option value="Aguardando Orçamento Oficina">Aguardando Orçamento Oficina</option>
                                <option value="Orçamento Pronto / Em Análise">Orçamento Pronto / Em Análise</option>
                                <option value="Orçamento Aprov
